version: 2.1

executors:
  android-executor:
    docker:
      - image: cimg/android:2024.04-node
    working_directory: ~/repo

jobs:
  build-apk:
    executor: android-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - flutter-sdk-v1-{{ checksum "flutter_app/pubspec.yaml" }}
            - flutter-sdk-v1-
      - run:
          name: Install Flutter SDK
          command: |
            if [ ! -d ~/flutter ]; then
              git clone https://github.com/flutter/flutter.git -b stable --depth 1 ~/flutter
            fi
            echo 'export PATH="$HOME/flutter/bin:$PATH"' >> $BASH_ENV
      - save_cache:
          key: flutter-sdk-v1-{{ checksum "flutter_app/pubspec.yaml" }}
          paths:
            - ~/flutter
      - run:
          name: Verify Flutter Doctor
          command: flutter doctor -v
      - run:
          name: Install Dependencies
          command: |
            cd flutter_app
            flutter pub get
      - run:
          name: Analyze Code
          command: |
            cd flutter_app
            flutter analyze --no-fatal-infos
      - run:
          name: Install CMake & Ninja Build Tools
          command: |
            sudo apt-get update && sudo apt-get install -y cmake ninja-build
            sdkmanager "cmake;3.22.1" || true
      - run:
          name: Decode Release Keystore & Configure Key Properties
          command: |
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo "$KEYSTORE_BASE64" | base64 -d > flutter_app/android/app/upload-keystore.jks
              printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=app/upload-keystore.jks\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > flutter_app/android/key.properties
              echo "Release Keystore configured successfully."
            else
              echo "No KEYSTORE_BASE64 environment variable found. Building with debug signing."
            fi
      - run:
          name: Build Release Android APK
          command: |
            cd flutter_app
            flutter build apk --release --no-tree-shake-icons
      - store_artifacts:
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          destination: todo-next-android-app/app-release.apk

workflows:
  version: 2
  build-flutter-apk-workflow:
    jobs:
      - build-apk:
          filters:
            branches:
              only:
                - main
                - master
