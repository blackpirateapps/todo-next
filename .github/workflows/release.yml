name: Manual Release & Artifacts

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Git Tag (e.g. v1.1.0)'
        required: true
        type: string
      release_title:
        description: 'Release Title (e.g. Todo Next v1.1.0)'
        required: true
        default: 'Todo Next Release'
        type: string
      release_notes:
        description: 'Release Notes / Changelog'
        required: false
        type: string
        default: 'Release compiled and published via GitHub Actions.'
      draft:
        description: 'Publish as Draft'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Publish as Pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify Web Build
        run: |
          npm ci
          npm run build

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter unit & widget tests
        working-directory: flutter_app
        run: flutter test

      - name: Configure Keystore & key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > flutter_app/android/app/upload-keystore.jks
            echo "storePassword=$KEYSTORE_PASSWORD" > flutter_app/android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> flutter_app/android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> flutter_app/android/key.properties
            echo "storeFile=upload-keystore.jks" >> flutter_app/android/key.properties
            echo "Release Keystore configured successfully."
          else
            echo "No KEYSTORE_BASE64 secret found. Falling back to debug signing."
          fi

      - name: Build Split-per-ABI APKs
        working-directory: flutter_app
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Build Universal APK
        working-directory: flutter_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Android App Bundle (AAB)
        working-directory: flutter_app
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Stage and Rename Release Artifacts
        id: stage_artifacts
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          mkdir -p release_assets

          # Copy universal APK
          if [ -f flutter_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp flutter_app/build/app/outputs/flutter-apk/app-release.apk "release_assets/todo-next-${TAG}-universal.apk"
          fi

          # Copy ABI-specific APKs
          if [ -f flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release_assets/todo-next-${TAG}-arm64-v8a.apk"
          fi
          if [ -f flutter_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp flutter_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release_assets/todo-next-${TAG}-armeabi-v7a.apk"
          fi
          if [ -f flutter_app/build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
            cp flutter_app/build/app/outputs/flutter-apk/app-x86_64-release.apk "release_assets/todo-next-${TAG}-x86_64.apk"
          fi

          # Copy App Bundle
          if [ -f flutter_app/build/app/outputs/bundle/release/app-release.aab ]; then
            cp flutter_app/build/app/outputs/bundle/release/app-release.aab "release_assets/todo-next-${TAG}.aab"
          fi

          # Generate SHA-256 checksums
          cd release_assets
          sha256sum * > sha256sums.txt || true
          cd ..

          echo "Staged release assets:"
          ls -lah release_assets/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_title }}
          body: ${{ github.event.inputs.release_notes }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
