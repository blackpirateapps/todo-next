name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Doctor
        run: flutter doctor -v

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze code
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests
        working-directory: flutter_app
        run: flutter test

      - name: Configure Keystore & key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > flutter_app/android/app/upload-keystore.jks
            echo "storePassword=$KEYSTORE_PASSWORD" > flutter_app/android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> flutter_app/android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> flutter_app/android/key.properties
            echo "storeFile=upload-keystore.jks" >> flutter_app/android/key.properties
            echo "Release Keystore configured successfully."
          else
            echo "No KEYSTORE_BASE64 secret found. Falling back to debug signing."
          fi

      - name: Build Release APKs (Split per ABI & Universal)
        working-directory: flutter_app
        run: |
          echo "Building split-per-abi APKs..."
          flutter build apk --release --split-per-abi --no-tree-shake-icons
          echo "Building universal fat APK..."
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: todo-next-android-apks
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
